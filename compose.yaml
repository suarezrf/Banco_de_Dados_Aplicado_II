services:
  mongo:
    image: mongo:8
    container_name: novacompra-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_novacompra:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo_novacompra:
